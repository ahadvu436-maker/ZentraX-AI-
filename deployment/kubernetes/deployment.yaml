apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentrax-api
  namespace: zentrax
  labels:
    app.kubernetes.io/name: zentrax-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zentrax-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zentrax-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/REPLACE_OWNER/zentrax-api:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: zentrax-config
            - secretRef:
                name: zentrax-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentrax-worker
  namespace: zentrax
  labels:
    app.kubernetes.io/name: zentrax-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zentrax-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zentrax-worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/REPLACE_OWNER/zentrax-worker:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: zentrax-config
            - secretRef:
                name: zentrax-secrets
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
