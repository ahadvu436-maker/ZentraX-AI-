# =============================================================================
# ZentraX AI — Nginx reverse proxy
# Routes:
#   /            -> frontend (Next.js, port 3000)
#   /api/        -> backend  (Python API, port 8000)
# Terminates TLS, redirects HTTP -> HTTPS, adds baseline security headers.
#
# Replace ${DOMAIN}, and the cert/key paths, before deploying.
# If using envsubst / docker entrypoint templating, this file can be named
# nginx.conf.template and rendered at container start.
# =============================================================================

# ---- Rate limiting zones (mitigate brute force / abuse on API) -------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ---- Upstreams ---------------------------------------------------------------
upstream zentrax_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream zentrax_backend {
    server backend:8000;
    keepalive 32;
}

# ---- HTTP: redirect everything to HTTPS, except ACME challenge -------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Let's Encrypt / ACME HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: main server block ------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # --- TLS certificate placeholders ---
    # Point these at your real certificate/key (Let's Encrypt, ACM, etc.)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # --- TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (requires ssl_trusted_certificate for full chain validation)
    ssl_stapling on;
    ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide backend server signature
    server_tokens off;

    client_max_body_size 10M;

    # --- API routes -> Python backend ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://zentrax_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support long-running / streaming responses (e.g. AI model output)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # Websocket support, if the API uses it
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Everything else -> Next.js frontend ---
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://zentrax_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js hot-reload / websocket support (dev); harmless in prod
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Block access to hidden files (.env, .git, etc.) if ever served from a root
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}