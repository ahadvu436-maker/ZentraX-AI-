[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zentrax-zero-trust-security"
version = "0.1.0"
description = "ZentraX Zero-Trust Security development baseline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zentrax_zero_trust_security*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
