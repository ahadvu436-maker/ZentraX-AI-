# =============================================================================
# ZentraX security-policy.conf
# Hybrid-cloud API gateway / edge security policy
# Format: HAProxy/Envoy-style directives with inline comments.
# Adapt directive syntax to your actual gateway (Envoy, Apigee, Cloud Armor,
# NGINX) — this expresses the policy intent in a portable, reviewable form.
# =============================================================================

[tls]
min_version = TLSv1.2
preferred_version = TLSv1.3
cipher_suites = TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256, TLS_AES_128_GCM_SHA256
hsts_enabled = true
hsts_max_age_seconds = 63072000
hsts_include_subdomains = true
ocsp_stapling = true
certificate_source = gcp-certificate-manager
auto_renew = true

[mutual_tls]
enabled = true
required_for_zones = internal-services, admin-api
client_ca_bundle = /etc/zentrax/certs/internal-ca.pem
verify_depth = 2

[zero_trust]
model = BeyondCorp
default_deny = true
identity_provider = workload-identity-federation
require_device_attestation = true
session_max_age_minutes = 60
continuous_verification = true

[waf]
engine = cloud-armor
mode = enforce
owasp_crs_version = 3.3
rules_enabled = sqli, xss, rce, lfi, rfi, php-injection, session-fixation
rate_limit_requests_per_minute = 600
rate_limit_ban_duration_seconds = 900
geo_fencing = allow-list
allowed_regions = US, CA, EU, SG, AU

[ddos_protection]
provider = cloud-armor-adaptive-protection
auto_mitigation = true
baseline_learning_period_days = 7
alert_threshold_multiplier = 3

[api_gateway]
authentication = oauth2-oidc
token_lifetime_minutes = 15
refresh_token_rotation = true
require_scopes = true
request_size_limit_mb = 10
quota_per_api_key_per_minute = 1000

[secrets]
manager = gcp-secret-manager
rotation_days = 90
encryption_at_rest = CMEK
kms_key_ring = zentrax-keyring
kms_key_name = zentrax-primary-key

[network_segmentation]
default_policy = deny-all
allowed_ingress:
  - from = load-balancer-subnet
    to = api-tier-subnet
    ports = 443
  - from = api-tier-subnet
    to = data-tier-subnet
    ports = 5432, 6379
allowed_egress:
  - from = api-tier-subnet
    to = 0.0.0.0/0
    ports = 443
    note = "outbound HTTPS only, via NAT gateway"

[logging_and_audit]
audit_log_all_admin_actions = true
log_retention_days = 400
siem_export = true
siem_destination = chronicle
tamper_evidence = write-once-storage

[incident_response]
auto_isolate_on_critical_alert = true
notification_channels = pagerduty, security-slack-channel
escalation_timeout_minutes = 15

[compliance_baseline]
frameworks = SOC2-TypeII, ISO27001, GDPR, CCPA
vulnerability_scan_frequency = weekly
patch_sla_critical_hours = 24
patch_sla_high_hours = 72
