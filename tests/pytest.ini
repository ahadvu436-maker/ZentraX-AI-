[pytest]
addopts = -ra --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = unit integration system performance security regression
markers =
    unit: fast isolated tests
    integration: tests across module boundaries
    system: end-to-end or deployed-system tests
    performance: timing/load smoke tests
    security: security-focused checks
    regression: tests guarding previously fixed defects
