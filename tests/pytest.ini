[pytest]
minversion = 8.0
testpaths = 19_tests
pythonpath = . 19_tests
addopts = -ra --strict-markers --strict-config --tb=short
xfail_strict = true
filterwarnings =
    error
markers =
    unit: isolated component and logic tests
    integration: cross-module and service communication tests
    system: end-to-end tests in a clean subprocess
    performance: latency and throughput budgets
    security: zero-trust, permission and vulnerability checks
    regression: one test per fixed defect
    allow_network: test may open network sockets
